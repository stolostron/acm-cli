# Default values for acm-cli.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# For Openshift clusters, setting to "true" deploys the Route and
# ConsoleCLIDownload objects. The Route terminates TLS at the edge, so
# clients reach the server over HTTPS while the server itself only ever
# serves plain HTTP.
isOpenshift: false

# ConsoleCLIDownload Settings
# Version to display in the title
acmVersion: latest
# Domain to use for the file links
ingress:
  domain: example.com

# Deployment settings
imagePullPolicy: Never
